<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>+55 Real Estate Global | Painel Acesso Administrativo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/tailwind.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles/style.css') }}">
    </head>
    <body class="min-h-screen bg-tk-paper text-tk-ink font-text">
        <div class="min-h-screen flex flex-col md:flex-row">
        <header class="md:hidden relative bg-tk-surface border-b border-tk-primary/15">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex flex-col">
                    <span class="text-[10px] font-semibold tracking-widest uppercase text-tk-brass">+55 Real Estate Global</span>
                    <span class="font-display text-base font-bold text-tk-ink">Painel Administrativo</span>
                </div>
                <details>
                    <summary class="cursor-pointer list-none text-sm font-medium text-tk-ink px-4 py-2 border border-tk-primary/15 rounded min-h-[44px] flex items-center">Menu</summary>
                    <nav class="absolute left-0 right-0 top-full flex flex-col gap-1 px-4 py-4 bg-tk-surface border-b border-tk-primary/15 z-10">
                        <span class="text-sm font-thin text-tk-ink px-4 pb-2">Olá, {{ g.current_user.username }}</span>
                        <a href="{{ url_for('admin.real_estate') }}" class="flex items-center px-4 py-3 text-sm font-medium rounded text-tk-ink min-h-[44px] {{ 'bg-tk-primary/5' if request.endpoint.startswith('admin.real_estate') }}">Gerenciar Imóveis</a>
                        <a href="{{ url_for('admin.pages') }}" class="flex items-center px-4 py-3 text-sm font-medium rounded text-tk-ink min-h-[44px] {{ 'bg-tk-primary/5' if request.endpoint.startswith('admin.pages') }}">Gerenciar Página</a>
                        <a href="{{ url_for('admin.logout') }}" class="flex items-center px-4 py-3 text-sm font-medium rounded text-red-800 bg-red-50 min-h-[44px]">Sair da conta</a>
                    </nav>
                </details>
            </div>
        </header>
        <aside class="hidden md:flex w-72 bg-tk-surface border-r border-tk-primary/15 min-h-screen flex-col justify-between p-6 shrink-0 fixed">
            <div class="space-y-8">
                <div class="space-y-1">
                    <span class="block text-[10px] font-semibold tracking-widest uppercase text-tk-brass">
                        +55 Real Estate Global
                    </span>
                    <h1 class="font-display text-lg font-bold text-tk-ink">
                        Painel Administrativo
                    </h1>
                    <h1 class="font-display text-sm font-thin text-tk-ink">
                        Olá, {{ g.current_user.username }}
                    </h1>
                </div>

                <hr class="border-tk-primary/10">

                    <nav class="flex flex-col gap-2">
                        <a href="{{ url_for('admin.real_estate') }}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded text-tk-ink/70 {{ 'bg-tk-primary/5' if request.endpoint.startswith('admin.real_estate') }} hover:text-tk-ink hover:bg-tk-primary/5">
                        <svg class="w-4 h-4 text-tk-brass" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                        </svg>
                        <span>Gerenciar Imóveis</span>
                    </a>

                    <a href="{{ url_for('admin.pages') }}" class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded text-tk-ink/70 {{ 'bg-tk-primary/5' if request.endpoint.startswith('admin.pages') }} hover:text-tk-ink hover:bg-tk-primary/5">
                        <svg class="w-4 h-4 text-tk-brass" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        <span>Gerenciar Página</span>
                    </a>
                </nav>
            </div>

            <div class="pt-6 border-t border-tk-primary/10">
                <a href="{{ url_for('admin.logout') }}" class="flex items-center justify-between px-4 py-3 text-sm font-medium text-red-800 bg-red-50 hover:bg-red-100 rounded">
                    <span>Sair da conta</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </a>
            </div>
        </aside>
        <div class="flex-1 md:ml-72 p-4 md:p-8 min-w-0">
            {% block content %}{% endblock %}
        </div>
        </div>
    </body>
</html>
