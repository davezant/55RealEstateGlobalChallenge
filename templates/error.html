{% extends "base.html" %}

{% block title %}+55 Real Estate Global | Não encontrado{% endblock %}

{% block content %}
<main class="max-w-3xl mx-auto px-6 py-24 flex flex-col items-start gap-6">
    <span class="text-overline font-semibold uppercase text-brass-text tracking-widest">404</span>
    <h1 class="font-display text-h1 text-primary">{{ message }}</h1>
    <p class="text-lead text-ink-muted">O endereço que você abriu não existe ou não está mais disponível.</p>
    <a href="{{ back_url }}" class="inline-flex items-center justify-center gap-3 bg-primary text-on-primary font-medium text-small px-8 py-4 rounded hover:bg-primary-700 shadow-sm">
        <span>← {{ back_label }}</span>
    </a>
</main>
{% endblock %}
